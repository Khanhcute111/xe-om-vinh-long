function snapN(px,pz){let b=null;for(const R_ of ROAD){const u=cl(R_.h?px:pz,R_.a0,R_.a1),q=R_.h?{x:u,z:R_.c}:{x:R_.c,z:u},d=Math.hypot(q.x-px,q.z-pz);if(!b||d<b.d)b={d,q,R:R_}}return{x:b.q.x,z:b.q.z,H:b.R.h?b.R:null,V:b.R.h?null:b.R,adj:[]}}
function routeTo(sx,sz,ex,ez){const s=snapN(sx,sz),e=snapN(ex,ez),N=INTER.concat([s,e]);for(const n of N)n.adj=[];
for(const R_ of ROAD){const on=N.filter(n=>n.H===R_||n.V===R_).sort((p,q)=>R_.h?p.x-q.x:p.z-q.z);for(let i=1;i<on.length;i++){const w=Math.hypot(on[i].x-on[i-1].x,on[i].z-on[i-1].z);on[i].adj.push([on[i-1],w]);on[i-1].adj.push([on[i],w])}}
const D=new Map(),pv=new Map(),Q=new Set(N);N.forEach(n=>D.set(n,1e9));D.set(s,0);
while(Q.size){let u=null;for(const n of Q)if(!u||D.get(n)<D.get(u))u=n;if(D.get(u)>=1e9||u===e)break;Q.delete(u);for(const[n,w]of u.adj)if(D.get(u)+w<D.get(n)){D.set(n,D.get(u)+w);pv.set(n,u)}}
const P=[];for(let n=e;n;n=pv.get(n))P.unshift({x:n.x,z:n.z});return[{x:sx,z:sz},...P,{x:ex,z:ez}]}
let PATH=null,rtT=0,rib=null,ribTg=null;
function buildRib(P,col){if(rib){S.remove(rib);rib.geometry.dispose()}const ps=[];for(let i=0;i<P.length-1;i++){const A=P[i],B2=P[i+1],dx=B2.x-A.x,dz=B2.z-A.z,l=Math.hypot(dx,dz);if(l<.1)continue;const nx=-dz/l*1.5,nz=dx/l*1.5;ps.push(A.x+nx,.18,A.z+nz,A.x-nx,.18,A.z-nz,B2.x+nx,.18,B2.z+nz,B2.x+nx,.18,B2.z+nz,A.x-nx,.18,A.z-nz,B2.x-nx,.18,B2.z-nz)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(ps,3));rib=new T.Mesh(g,new T.MeshBasicMaterial({color:col,transparent:true,opacity:.6,depthWrite:false,side:T.DoubleSide}));S.add(rib)}
function routeUpd(tt,p){if(!tt||mode=='sit'){PATH=null;if(rib)rib.visible=false;$('nav').textContent='';return}
rtT-=.1;if(rtT<=0||!PATH||ribTg!==tt){rtT=.8;ribTg=tt;PATH=routeTo(p.x,p.z,tt.x,tt.z);buildRib(PATH,ord?(ord.ph=='pick'?0xffc83d:0x35d07f):0x5ac8fa)}if(rib)rib.visible=true;
const P=[{x:p.x,z:p.z}].concat(PATH.slice(1));while(P.length>2&&Math.hypot(P[1].x-p.x,P[1].z-p.z)<8)P.splice(1,1);
const Q=[P[0]];for(let i=1;i<P.length;i++)if(Math.hypot(P[i].x-Q[Q.length-1].x,P[i].z-Q[Q.length-1].z)>.5)Q.push(P[i]);
let tot=0,acc=0,tn=null;for(let i=1;i<Q.length;i++){const l=Math.hypot(Q[i].x-Q[i-1].x,Q[i].z-Q[i-1].z);tot+=l;if(!tn){acc+=l;if(i<Q.length-1){const d1=[(Q[i].x-Q[i-1].x)/l,(Q[i].z-Q[i-1].z)/l],l2=Math.hypot(Q[i+1].x-Q[i].x,Q[i+1].z-Q[i].z)||1,d2=[(Q[i+1].x-Q[i].x)/l2,(Q[i+1].z-Q[i].z)/l2];if(d1[0]*d2[0]+d1[1]*d2[1]<.7)tn=d2[0]*d1[1]-d2[1]*d1[0]>0?'trái':'phải'}}}
const ha=mode=='ride'?a:drv.g.rotation.y;let fw=1;if(Q.length>1){const l0=Math.hypot(Q[1].x-Q[0].x,Q[1].z-Q[0].z)||1;fw=(Q[1].x-Q[0].x)/l0*Math.sin(ha)+(Q[1].z-Q[0].z)/l0*Math.cos(ha)}
let tx;if(tot<25)tx='📍 Đã tới nơi, dừng xe lại';else if(mode=='ride'&&fw<-.35)tx='↩ Quay đầu xe rồi đi theo đường xanh';else if(tn)tx=(tn=='trái'?'↰ ':'↱ ')+(acc<45?'Rẽ '+tn+' ngay':'Đi thẳng '+Math.round(acc)+' m rồi rẽ '+tn);else tx='⬆ Đi thẳng '+Math.round(tot)+' m tới nơi';
$('nav').textContent=tx;$('dist').textContent='Còn '+Math.round(tot)+' m theo đường'}

const tt=t||(mode!='sit'&&nearest()),p=mode=='ride'?{x,z}:drv.g.position;if(tt&&mode!='sit'){const d=Math.hypot(tt.x-p.x,tt.z-p.z);$('dist').textContent=Math.round(d)+' m';let rel=Math.atan2(tt.x-p.x,tt.z-p.z)-(mode=='ride'?a:drv.g.rotation.y);rel=Math.atan2(Math.sin(rel),Math.cos(rel));$('arr').style.transform='rotate('+(-rel)+'rad)'}else $('dist').textContent='';routeUpd(tt,p);
let f='',g='';if(mode=='ride')f=ord&&ord.ph=='ride'?'':'Xuống xe';else if(mode=='foot')f=nearBike()?'Lên xe':'';else if(mode=='sit')f='Lên xe';g=mode=='foot'&&nearSt()?'Ngồi chờ đơn':mode=='sit'?'Đứng dậy':'';
